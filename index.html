<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simple E-Commerce Page</title>
<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f4f4;
}

header {
  background: #333;
  color: white;
  padding: 15px;
  text-align: center;
}

nav {
  background: #555;
  padding: 10px;
  text-align: center;
}

nav a {
  color: white;
  margin: 0 15px;
  text-decoration: none;
  font-weight: bold;
}

.container {
  width: 1000px;
  margin: 20px auto;
  display: flex;
  gap: 20px;
}

.product {
  width: 300px;
  background: white;
  border: 1px solid #ddd;
  padding: 15px;
  text-align: center;
}

.product img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.price {
  color: green;
  font-size: 20px;
  margin: 10px 0;
}

button {
  background: #28a745;
  color: white;
  border: none;
  padding: 10px 15px;
  cursor: pointer;
}

button:hover {
  background: #218838;
}

footer {
  clear: both;
  background: #333;
  color: white;
  text-align: center;
  padding: 15px;
  margin-top: 40px;
}
</style>
</head>
<body>

<header>
  <h1>My E-Commerce Store</h1>
  <p>Simple Product Page (Non‑Responsive)</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Products</a>
  <a href="#">Contact</a>
</nav>

<div class="container">

  <div class="product">
    <img src="LEVEL_LEVEL_WHT-L.GRY_07_831c7a2c-ff1b-4011-9268-b11f984219c6.webp" alt="Product">
    <h3>Product 1</h3>
    <p>Good quality product description.</p>
    <div class="price">₹999</div>
    <button>Add to Cart</button>
  </div>

  <div class="product">
    <img src="Poedagar-Men-Watch-Luxury-Business-Quartz-Watches-Stainless-Stain-Strap-Sport-Chronograph-Men-39-s-Wristwatch-Waterproof-Luminous-Quartz-Wristwatches_7b31bf36-11cf-4c68-8dfd-e630bc9a93f6.284ee349d31df69a9da1c2d294e2aade.avif" alt="Product">
    <h3>Product 2</h3>
    <p>Best selling item in store.</p>
    <div class="price">₹1499</div>
    <button>Add to Cart</button>
  </div>

  <div class="product">
    <img src="product-jpeg-500x500.webp" alt="Product">
    <h3>Product 3</h3>
    <p>Limited stock available.</p>
    <div class="price">₹799</div>
    <button>Add to Cart</button>
  </div>

</div>

<footer>
  <p>© 2026 My E-Commerce Store</p>
</footer>

</body>
</html>
